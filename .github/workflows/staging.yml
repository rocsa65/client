name: Staging CI - Test & Build

on:
  push:
    branches: [ staging ]
  pull_request:
    branches: [ staging ]

# Configure permissions for GITHUB_TOKEN
permissions:
  contents: read          # Read repository content
  packages: write         # Write to GitHub Container Registry (for staging images)
  pull-requests: write   # Comment on PRs

env:
  NODE_VERSION: '18'

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run unit tests
      run: npm run test:unit -- --coverage --watchAll=false

    - name: Run integration tests
      run: npm run test:integration -- --coverage --watchAll=false

    - name: Run security audit
      run: npm audit --audit-level=critical

    - name: Upload test coverage
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage/lcov.info
        fail_ci_if_error: false

  build-verification:
    runs-on: ubuntu-latest
    needs: test
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Build for staging
      run: npm run build
      env:
        REACT_APP_ENV: staging

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: staging-build
        path: build/
        retention-days: 7

  # Build staging Docker image (only on push to staging)
  docker-build-and-publish:
    runs-on: ubuntu-latest
    needs: [test, build-verification]
    if: github.event_name == 'push' && github.ref == 'refs/heads/staging'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push staging image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile
        push: true
        tags: |
          ghcr.io/${{ github.repository }}:staging-latest
          ghcr.io/${{ github.repository }}:staging-${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        labels: |
          org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          org.opencontainers.image.description=MyFinance Client - Staging Build
          org.opencontainers.image.licenses=MIT

    - name: Make package public
      run: |
        echo "Attempting to make package public..."
        sleep 5
        curl -s -X PATCH \
          -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
          -H "Accept: application/vnd.github.v3+json" \
          https://api.github.com/user/packages/container/client \
          -d '{"visibility":"public"}' || echo "Package visibility setting handled automatically"

    - name: Image publication summary
      run: |
        echo "## 🧪 Staging Docker Image Published" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Registry:** GitHub Container Registry" >> $GITHUB_STEP_SUMMARY
        echo "**Image:** \`ghcr.io/${{ github.repository }}\`" >> $GITHUB_STEP_SUMMARY
        echo "**Tags:**" >> $GITHUB_STEP_SUMMARY
        echo "- \`staging-latest\` (latest staging build)" >> $GITHUB_STEP_SUMMARY
        echo "- \`staging-${{ github.sha }}\` (commit reference)" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Purpose:** Pre-production testing and QA validation" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Deploy to Staging:**" >> $GITHUB_STEP_SUMMARY
        echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
        echo "docker pull ghcr.io/${{ github.repository }}:staging-latest" >> $GITHUB_STEP_SUMMARY
        echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

  # Comment on PR with status
  pr-feedback:
    runs-on: ubuntu-latest
    needs: [test, build-verification]
    if: github.event_name == 'pull_request'
    
    steps:
    - name: Comment on PR
      uses: actions/github-script@v7
      with:
        script: |
          const comment = `## ✅ Staging CI Pipeline Status
          
          **Tests Passed** - All unit and integration tests are passing
          **Security Check Passed** - No critical vulnerabilities found
          **Build Verification Passed** - Application builds successfully for staging
          
          ### 🎯 Ready for Staging Review
          This PR is ready to be merged to staging branch for QA testing.
          
          **Next Steps:**
          1. Merge to staging → Docker image will be built and published
          2. Deploy to staging environment for QA testing
          3. After QA approval → Merge to production branch
          
          **Note:** Staging deployment enables comprehensive QA and integration testing.`;
          
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: comment
          });