name: Staging CI/CD

on:
  push:
    branches: [ staging ]

# Configure permissions for GITHUB_TOKEN
permissions:
  contents: read          # Read repository content
  packages: write         # Write to GitHub Container Registry
  issues: write          # Create issues if needed

env:
  NODE_VERSION: '18'

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run tests
      run: npm test -- --coverage --watchAll=false

    - name: Run E2E tests
      run: |
        # Add your E2E test commands here
        # npm run test:e2e
        echo "E2E tests would run here"

  security-scan:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Run security audit
      run: npm audit --audit-level=high

  build:
    runs-on: ubuntu-latest
    needs: [test, security-scan]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Build application
      run: npm run build
      env:
        REACT_APP_ENV: staging
        # REACT_APP_API_URL: ${{ secrets.STAGING_API_URL }}  # Add when you have an API

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: build-files-staging
        path: build/
        retention-days: 30

  docker-build:
    runs-on: ubuntu-latest
    needs: [test, security-scan, build]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile
        push: true
        tags: |
          ghcr.io/${{ github.repository }}:staging-latest
          ghcr.io/${{ github.repository }}:staging-${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        labels: |
          org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          org.opencontainers.image.description=MyFinance Client - Staging Build
          org.opencontainers.image.licenses=MIT

    - name: Make package public
      run: |
        # Make the package public automatically
        curl -X PATCH \
          -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
          -H "Accept: application/vnd.github.v3+json" \
          https://api.github.com/orgs/${{ github.repository_owner }}/packages/container/client \
          -d '{"visibility":"public"}' || \
        curl -X PATCH \
          -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
          -H "Accept: application/vnd.github.v3+json" \
          https://api.github.com/user/packages/container/client \
          -d '{"visibility":"public"}' || echo "Package might already be public or this is the first push"

  deploy-staging:
    runs-on: ubuntu-latest
    needs: [docker-build]
    environment: staging
    
    steps:
    - name: Deploy to Staging Environment
      run: |
        echo "Deploying to staging environment..."
        # Add your deployment commands here
        # This could include:
        # - Updating Kubernetes deployments
        # - Deploying to cloud services (AWS, Azure, GCP)
        # - Running deployment scripts

    - name: Run smoke tests
      run: |
        echo "Running smoke tests against staging environment..."
        # Add smoke test commands here
        # curl -f ${{ secrets.STAGING_URL }}/health || exit 1