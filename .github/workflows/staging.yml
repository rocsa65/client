name: Staging CI - Test & Build

on:
  push:
    branches: [ staging ]
  pull_request:
    branches: [ staging ]

# Configure permissions for GITHUB_TOKEN
permissions:
  contents: read          # Read repository content
  packages: write         # Write to GitHub Container Registry (for staging images)
  pull-requests: write   # Comment on PRs

env:
  NODE_VERSION: '18'

jobs:
  # ====================================
  # STAGE 1: Build
  # ====================================
  build:
    name: "Build Application"
    runs-on: ubuntu-latest

    steps:
    # --- Setup Stage ---
    - name: 📥 Checkout code
      uses: actions/checkout@v4

    - name: ⚙️ Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'

    - name: 📦 Install dependencies
      run: npm ci

    # --- Build Stage ---
    - name: 🔨 Build application
      run: npm run build
      env:
        REACT_APP_ENV: staging

    # --- Security Stage ---
    - name: 🔒 Run security audit
      run: npm audit --audit-level=critical

  # ====================================
  # STAGE 2: Unit Tests
  # ====================================
  unit-tests:
    name: "Unit Tests"
    runs-on: ubuntu-latest
    needs: build

    steps:
    # --- Setup Stage ---
    - name: 📥 Checkout code
      uses: actions/checkout@v4

    - name: ⚙️ Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'

    - name: 📦 Install dependencies
      run: npm ci

    # --- Test Stage ---
    - name: 🧪 Run unit tests
      run: npm run test:unit -- --coverage --watchAll=false

    # --- Coverage Stage ---
    - name: 📊 Upload unit test coverage
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage/lcov.info
        flags: unit-tests
        fail_ci_if_error: false

  # ====================================
  # STAGE 3: Integration Tests
  # ====================================
  integration-tests:
    name: "Integration Tests"
    runs-on: ubuntu-latest
    needs: [build, unit-tests]

    steps:
    # --- Setup Stage ---
    - name: 📥 Checkout code
      uses: actions/checkout@v4

    - name: ⚙️ Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'

    - name: 📦 Install dependencies
      run: npm ci

    # --- Test Stage ---
    - name: 🔗 Run integration tests
      run: npm run test:integration -- --coverage --watchAll=false

    # --- Coverage Stage ---
    - name: 📊 Upload integration test coverage
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage/lcov.info
        flags: integration-tests
        fail_ci_if_error: false

  # ====================================
  # STAGE 4: Build Verification
  # ====================================
  build-verification:
    name: "Build Verification"
    runs-on: ubuntu-latest
    needs: [build, unit-tests, integration-tests]
    
    steps:
    # --- Setup Stage ---
    - name: 📥 Checkout code
      uses: actions/checkout@v4

    - name: ⚙️ Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'

    - name: 📦 Install dependencies
      run: npm ci

    # --- Build Stage ---
    - name: 🔨 Build for staging
      run: npm run build
      env:
        REACT_APP_ENV: staging

    # --- Artifact Stage ---
    - name: 📤 Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: staging-build
        path: build/
        retention-days: 7

  # ====================================
  # STAGE 5: Docker Publish Approval
  # ====================================
  docker-publish-approval:
    name: "Docker Publish Approval"
    runs-on: ubuntu-latest
    needs: [build, unit-tests, integration-tests, build-verification]
    if: github.event_name == 'push' && github.ref == 'refs/heads/staging'
    environment:
      name: staging-docker-publish
      url: https://github.com/${{ github.repository }}/pkgs/container/client
    
    steps:
    - name: ✅ Approval checkpoint
      run: |
        echo "✅ Manual approval granted for Docker image publishing"
        echo "Proceeding to build and publish staging Docker image..."

  # ====================================
  # STAGE 6: Docker Build & Publish
  # ====================================
  docker-build-and-publish:
    name: "Docker Build & Publish to GHCR"
    runs-on: ubuntu-latest
    needs: docker-publish-approval
    if: github.event_name == 'push' && github.ref == 'refs/heads/staging'
    
    steps:
    # --- Setup Stage ---
    - name: 📥 Checkout code
      uses: actions/checkout@v4

    - name: 🐳 Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: 🔐 Login to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    # --- Build & Push Stage ---
    - name: 🔨 Build and push staging image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile
        push: true
        tags: |
          ghcr.io/${{ github.repository }}:staging-latest
          ghcr.io/${{ github.repository }}:staging-${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        labels: |
          org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          org.opencontainers.image.description=MyFinance Client - Staging Build
          org.opencontainers.image.licenses=MIT

    # --- Post-Publish Stage ---
    - name: 🌐 Make package public
      run: |
        echo "Attempting to make package public..."
        sleep 5
        curl -s -X PATCH \
          -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
          -H "Accept: application/vnd.github.v3+json" \
          https://api.github.com/user/packages/container/client \
          -d '{"visibility":"public"}' || echo "Package visibility setting handled automatically"

    - name: 📋 Image publication summary
      run: |
        echo "## 🧪 Staging Docker Image Published" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Registry:** GitHub Container Registry" >> $GITHUB_STEP_SUMMARY
        echo "**Image:** \`ghcr.io/${{ github.repository }}\`" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 📦 Published Tags:" >> $GITHUB_STEP_SUMMARY
        echo "- [\`staging-latest\`](https://github.com/${{ github.repository }}/pkgs/container/client) - Latest staging build" >> $GITHUB_STEP_SUMMARY
        echo "- \`staging-${{ github.sha }}\` - Commit reference" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 🔗 Quick Links:" >> $GITHUB_STEP_SUMMARY
        echo "- [View on GitHub Packages](https://github.com/${{ github.repository }}/pkgs/container/client)" >> $GITHUB_STEP_SUMMARY
        echo "- [View commit ${{ github.sha }}](https://github.com/${{ github.repository }}/commit/${{ github.sha }})" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Purpose:** Pre-production testing and QA validation" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 🚀 Deploy to Staging:" >> $GITHUB_STEP_SUMMARY
        echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
        echo "# Pull latest staging image" >> $GITHUB_STEP_SUMMARY
        echo "docker pull ghcr.io/${{ github.repository }}:staging-latest" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "# Or pull specific commit version" >> $GITHUB_STEP_SUMMARY
        echo "docker pull ghcr.io/${{ github.repository }}:staging-${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
        echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

  # ====================================
  # STAGE 7: PR Feedback
  # ====================================
  pr-feedback:
    name: "PR Feedback"
    runs-on: ubuntu-latest
    needs: [build, unit-tests, integration-tests, build-verification]
    if: github.event_name == 'pull_request'
    
    steps:
    - name: 💬 Update PR with status
      uses: actions/github-script@v7
      with:
        script: |
          const commentBody = `## ✅ Staging CI Pipeline Status

          **Build Status** - ✅ Passed
          **Unit Tests** - ✅ All tests passing
          **Integration Tests** - ✅ All tests passing
          **Build Verification** - ✅ Application builds successfully
          **Security Check** - ✅ No critical vulnerabilities found

          ### 🎯 Ready for Staging Review
          This PR is ready to be merged to staging branch for QA testing.

          **Next Steps:**
          1. Merge to staging → Docker image will be built and published
          2. Deploy to staging environment for QA testing
          3. After QA approval → Merge to production branch

          **Note:** Staging deployment enables comprehensive QA and integration testing.

          ---
          *Last updated: ${new Date().toUTCString()}*
          *Commit: ${context.sha.substring(0, 7)}*`;

          // Find existing comment
          const { data: comments } = await github.rest.issues.listComments({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
          });

          const botComment = comments.find(comment =>
            comment.user.type === 'Bot' &&
            comment.body.includes('Staging CI Pipeline Status')
          );

          // Update existing comment or create new one
          if (botComment) {
            await github.rest.issues.updateComment({
              comment_id: botComment.id,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: commentBody
            });
          } else {
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: commentBody
            });
          }