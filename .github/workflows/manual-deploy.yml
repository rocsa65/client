name: Manual Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        type: choice
        options:
          - development
          - staging
          - production
      version:
        description: 'Docker image version (optional, uses latest if empty)'
        required: false
        type: string
      skip_tests:
        description: 'Skip tests (not recommended for production)'
        required: false
        type: boolean
        default: false

env:
  NODE_VERSION: '18'

jobs:
  manual-deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      if: ${{ !github.event.inputs.skip_tests }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'

    - name: Install dependencies
      if: ${{ !github.event.inputs.skip_tests }}
      run: npm ci

    - name: Run tests
      if: ${{ !github.event.inputs.skip_tests }}
      run: npm test -- --watchAll=false

    - name: Determine image version
      id: version
      run: |
        if [ -n "${{ github.event.inputs.version }}" ]; then
          echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
        else
          case "${{ github.event.inputs.environment }}" in
            "development")
              echo "version=dev-latest" >> $GITHUB_OUTPUT
              ;;
            "staging")
              echo "version=staging-latest" >> $GITHUB_OUTPUT
              ;;
            "production")
              echo "version=latest" >> $GITHUB_OUTPUT
              ;;
          esac
        fi

    - name: Deploy to ${{ github.event.inputs.environment }}
      run: |
        echo "Deploying version ${{ steps.version.outputs.version }} to ${{ github.event.inputs.environment }}"
        # Add your deployment commands here based on environment
        # docker pull ghcr.io/${{ github.repository }}:${{ steps.version.outputs.version }}
        # kubectl set image deployment/myfinance-client container=ghcr.io/${{ github.repository }}:${{ steps.version.outputs.version }}