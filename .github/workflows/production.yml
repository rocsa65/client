name: Production CI - Build & Publish

on:
  push:
    branches: [ production ]
  pull_request:
    branches: [ production ]
  workflow_dispatch: # Allows manual trigger

# Configure permissions for GITHUB_TOKEN
permissions:
  contents: read          # Read repository content
  packages: write         # Write to GitHub Container Registry
  pull-requests: write   # Comment on PRs

env:
  NODE_VERSION: '18'

jobs:
  # ====================================
  # STAGE 1: Build
  # ====================================
  build:
    name: "Build Application"
    runs-on: ubuntu-latest

    steps:
    # --- Setup Stage ---
    - name: 📥 Checkout code
      uses: actions/checkout@v4

    - name: ⚙️ Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'

    - name: 📦 Install dependencies
      run: npm ci

    # --- Build Stage ---
    - name: 🔨 Build application
      run: npm run build
      env:
        REACT_APP_ENV: production
        GENERATE_SOURCEMAP: false

    # --- Security Stage ---
    - name: 🔒 Run security audit
      run: npm audit --audit-level=critical

  # ====================================
  # STAGE 2: Unit Tests
  # ====================================
  unit-tests:
    name: "Unit Tests"
    runs-on: ubuntu-latest
    needs: build

    steps:
    # --- Setup Stage ---
    - name: 📥 Checkout code
      uses: actions/checkout@v4

    - name: ⚙️ Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'

    - name: 📦 Install dependencies
      run: npm ci

    # --- Test Stage ---
    - name: 🧪 Run unit tests
      run: npm run test:unit -- --coverage --watchAll=false

    # --- Coverage Stage ---
    - name: 📊 Upload unit test coverage
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage/lcov.info
        flags: unit-tests
        fail_ci_if_error: false

  # ====================================
  # STAGE 3: Integration Tests
  # ====================================
  integration-tests:
    name: "Integration Tests"
    runs-on: ubuntu-latest
    needs: [build, unit-tests]

    steps:
    # --- Setup Stage ---
    - name: 📥 Checkout code
      uses: actions/checkout@v4

    - name: ⚙️ Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'

    - name: 📦 Install dependencies
      run: npm ci

    # --- Test Stage ---
    - name: 🔗 Run integration tests
      run: npm run test:integration -- --coverage --watchAll=false

    # --- Coverage Stage ---
    - name: 📊 Upload integration test coverage
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage/lcov.info
        flags: integration-tests
        fail_ci_if_error: false

    # --- Artifact Stage ---
    - name: 📤 Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: production-test-results
        path: coverage/
        retention-days: 30

  # ====================================
  # STAGE 4: Build Verification
  # ====================================
  build-verification:
    name: "Build Verification"
    runs-on: ubuntu-latest
    needs: [build, unit-tests, integration-tests]
    
    steps:
    # --- Setup Stage ---
    - name: 📥 Checkout code
      uses: actions/checkout@v4

    - name: ⚙️ Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'

    - name: 📦 Install dependencies
      run: npm ci

    # --- Build Stage ---
    - name: 🔨 Build application (Release)
      run: npm run build
      env:
        REACT_APP_ENV: production
        GENERATE_SOURCEMAP: false

    # --- Artifact Stage ---
    - name: 📤 Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: production-build
        path: build/
        retention-days: 30

  # ====================================
  # STAGE 5: PR Feedback
  # ====================================
  pr-feedback:
    name: "PR Feedback"
    runs-on: ubuntu-latest
    needs: [build, unit-tests, integration-tests, build-verification]
    if: github.event_name == 'pull_request'
    
    steps:
    - name: 💬 Update PR with status
      uses: actions/github-script@v7
      with:
        script: |
          const commentBody = `## ✅ Production CI Pipeline Status

          **Build Status** - ✅ Passed
          **Unit Tests** - ✅ All tests passing
          **Integration Tests** - ✅ All tests passing
          **Build Verification** - ✅ Application builds successfully
          **Security Check** - ✅ No critical/high vulnerabilities found

          ### 🚀 Next Steps After Merge:
          1. Docker image will be built and published to GitHub Packages
          2. Image will be available for Jenkins deployment pipeline
          3. Release Manager can trigger production deployment via Jenkins

          **Ready for review and merge!** 🎉

          **Note:** Actual deployment to production is managed by Jenkins pipeline in the Infrastructure repository.

          ---
          *Last updated: ${new Date().toUTCString()}*
          *Commit: ${context.sha.substring(0, 7)}*`;

          // Find existing comment
          const { data: comments } = await github.rest.issues.listComments({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
          });

          const botComment = comments.find(comment =>
            comment.user.type === 'Bot' &&
            comment.body.includes('Production CI Pipeline Status')
          );

          // Update existing comment or create new one
          if (botComment) {
            await github.rest.issues.updateComment({
              comment_id: botComment.id,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: commentBody
            });
          } else {
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: commentBody
            });
          }

  # ====================================
  # STAGE 6: Docker Publish Approval
  # ====================================
  docker-publish-approval:
    name: "Docker Publish Approval"
    runs-on: ubuntu-latest
    needs: [build, unit-tests, integration-tests, build-verification]
    if: github.event_name == 'push' && github.ref == 'refs/heads/production'
    environment:
      name: production-docker-publish
      url: https://github.com/${{ github.repository }}/pkgs/container/client
    
    steps:
    - name: ✅ Approval checkpoint
      run: |
        echo "✅ Manual approval granted for Docker image publishing"
        echo "Proceeding to build and publish production Docker image..."

  # ====================================
  # STAGE 7: Docker Build & Publish
  # ====================================
  build-and-publish:
    name: "Docker Build & Publish to GHCR"
    runs-on: ubuntu-latest
    needs: docker-publish-approval
    if: github.event_name == 'push' && github.ref == 'refs/heads/production'
    
    steps:
    # --- Setup Stage ---
    - name: 📥 Checkout code
      uses: actions/checkout@v4

    - name: 🐳 Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: 🔐 Login to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    # --- Tag Generation Stage ---
    - name: 🏷️ Generate release tags
      id: meta
      run: |
        # Generate release number (could be from git tag, build number, etc.)
        BUILD_NUMBER=${GITHUB_RUN_NUMBER}
        RELEASE_TAG="v${BUILD_NUMBER}"
        SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
        TIMESTAMP=$(date +%Y%m%d-%H%M%S)
        
        echo "RELEASE_TAG=${RELEASE_TAG}" >> $GITHUB_OUTPUT
        echo "BUILD_NUMBER=${BUILD_NUMBER}" >> $GITHUB_OUTPUT
        echo "SHORT_SHA=${SHORT_SHA}" >> $GITHUB_OUTPUT
        echo "TIMESTAMP=${TIMESTAMP}" >> $GITHUB_OUTPUT
        
        echo "🏷️ Release tags generated:"
        echo "  - Release: ${RELEASE_TAG}"
        echo "  - Commit: ${SHORT_SHA}"
        echo "  - Timestamp: prod-${TIMESTAMP}"

    # --- Build & Push Stage ---
    - name: 🔨 Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile
        push: true
        tags: |
          ghcr.io/${{ github.repository }}:latest
          ghcr.io/${{ github.repository }}:${{ steps.meta.outputs.RELEASE_TAG }}
          ghcr.io/${{ github.repository }}:${{ steps.meta.outputs.SHORT_SHA }}
          ghcr.io/${{ github.repository }}:prod-${{ steps.meta.outputs.TIMESTAMP }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        labels: |
          org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          org.opencontainers.image.description=MyFinance Client - Production Build
          org.opencontainers.image.revision=${{ github.sha }}

    # --- Post-Publish Stage ---
    - name: 🌐 Make package public
      run: |
        echo "Attempting to make package public..."
        sleep 5
        curl -s -X PATCH \
          -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
          -H "Accept: application/vnd.github.v3+json" \
          https://api.github.com/user/packages/container/client \
          -d '{"visibility":"public"}' || echo "Package visibility setting skipped"

    - name: 📋 Image publication summary
      run: |
        echo "## 🚀 Production Docker Image Published Successfully" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Registry:** GitHub Container Registry" >> $GITHUB_STEP_SUMMARY  
        echo "**Image:** \`ghcr.io/${{ github.repository }}\`" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 📦 Published Tags:" >> $GITHUB_STEP_SUMMARY
        echo "- [\`latest\`](https://github.com/${{ github.repository }}/pkgs/container/client) - Latest production release" >> $GITHUB_STEP_SUMMARY
        echo "- [\`${{ steps.meta.outputs.RELEASE_TAG }}\`](https://github.com/${{ github.repository }}/pkgs/container/client) - Release version" >> $GITHUB_STEP_SUMMARY
        echo "- \`${{ steps.meta.outputs.SHORT_SHA }}\` - Commit reference" >> $GITHUB_STEP_SUMMARY
        echo "- \`prod-${{ steps.meta.outputs.TIMESTAMP }}\` - Deployment timestamp" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 🔗 Quick Links:" >> $GITHUB_STEP_SUMMARY
        echo "- [View on GitHub Packages](https://github.com/${{ github.repository }}/pkgs/container/client)" >> $GITHUB_STEP_SUMMARY
        echo "- [View commit ${{ github.sha }}](https://github.com/${{ github.repository }}/commit/${{ github.sha }})" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Infrastructure Deployment:** Use release tag \`${{ steps.meta.outputs.RELEASE_TAG }}\` for deployment" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 🚀 Deployment Commands:" >> $GITHUB_STEP_SUMMARY
        echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
        echo "# Deploy latest production release" >> $GITHUB_STEP_SUMMARY
        echo "docker pull ghcr.io/${{ github.repository }}:latest" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "# Deploy specific release version (recommended)" >> $GITHUB_STEP_SUMMARY
        echo "docker pull ghcr.io/${{ github.repository }}:${{ steps.meta.outputs.RELEASE_TAG }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "# Deploy specific commit" >> $GITHUB_STEP_SUMMARY
        echo "docker pull ghcr.io/${{ github.repository }}:${{ steps.meta.outputs.SHORT_SHA }}" >> $GITHUB_STEP_SUMMARY
        echo "\`\`\`" >> $GITHUB_STEP_SUMMARY