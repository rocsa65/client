name: Production CI/CD

on:
  push:
    branches: [ production ]
  workflow_dispatch: # Allows manual trigger

# Configure permissions for GITHUB_TOKEN
permissions:
  contents: read          # Read repository content
  packages: write         # Write to GitHub Container Registry
  issues: write          # Create deployment issues
  deployments: write     # Create deployment statuses
  actions: read          # Read workflow information

env:
  NODE_VERSION: '18'

jobs:
  pre-deployment-checks:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run full test suite
      run: npm test -- --coverage --watchAll=false

    - name: Run security audit
      run: npm audit --audit-level=moderate

    - name: Check build quality
      run: |
        npm run build
        # Check bundle size
        npx bundlesize

  build:
    runs-on: ubuntu-latest
    needs: pre-deployment-checks
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Build application
      run: npm run build
      env:
        REACT_APP_ENV: production
        # REACT_APP_API_URL: ${{ secrets.PROD_API_URL }}  # Add when you have an API
        GENERATE_SOURCEMAP: false

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: build-files-production
        path: build/
        retention-days: 90

  docker-build:
    runs-on: ubuntu-latest
    needs: build
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile
        push: true
        tags: |
          ghcr.io/${{ github.repository }}:latest
          ghcr.io/${{ github.repository }}:prod-${{ github.sha }}
          ghcr.io/${{ github.repository }}:v${{ github.run_number }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        labels: |
          org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          org.opencontainers.image.description=MyFinance Client - Production Build
          org.opencontainers.image.licenses=MIT

    - name: Make package public
      run: |
        # Make the package public automatically
        curl -X PATCH \
          -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
          -H "Accept: application/vnd.github.v3+json" \
          https://api.github.com/user/packages/container/client \
          -d '{"visibility":"public"}' || echo "Package might already be public or this is the first push"

  deploy-production:
    runs-on: ubuntu-latest
    needs: docker-build
    environment: production
    
    steps:
    - name: Create deployment issue
      uses: actions/github-script@v7
      with:
        script: |
          const issue = await github.rest.issues.create({
            owner: context.repo.owner,
            repo: context.repo.repo,
            title: `Production Deployment - ${context.sha.substring(0, 7)}`,
            body: `
            ## Production Deployment
            
            **Branch:** ${context.ref}
            **Commit:** ${context.sha}
            **Author:** ${context.actor}
            **Workflow:** ${context.workflow}
            
            This deployment is about to begin. Please monitor the deployment process.
            `
          });

    - name: Deploy to Production Environment
      run: |
        echo "Deploying to production environment..."
        # Add your production deployment commands here
        # This should be your most robust deployment process:
        # - Blue-green deployment
        # - Rolling deployment with health checks
        # - Database migrations if needed
        # - CDN cache invalidation

    - name: Health check
      run: |
        echo "Running production health checks..."
        # Wait for deployment to be ready
        sleep 30
        # Run health checks
        # curl -f ${{ secrets.PROD_URL }}/health || exit 1

    - name: Run smoke tests
      run: |
        echo "Running smoke tests against production..."
        # Add critical path smoke tests here

    - name: Update deployment status
      if: success()
      uses: actions/github-script@v7
      with:
        script: |
          await github.rest.repos.createDeploymentStatus({
            owner: context.repo.owner,
            repo: context.repo.repo,
            deployment_id: context.payload.deployment?.id || 0,
            state: 'success',
            environment: 'production',
            log_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
          });

  post-deployment:
    runs-on: ubuntu-latest
    needs: deploy-production
    if: success()
    
    steps:
    - name: Tag release
      uses: actions/github-script@v7
      with:
        script: |
          await github.rest.git.createRef({
            owner: context.repo.owner,
            repo: context.repo.repo,
            ref: `refs/tags/v${context.runNumber}`,
            sha: context.sha
          });

    - name: Create GitHub release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: v${{ github.run_number }}
        release_name: Release v${{ github.run_number }}
        body: |
          ## Changes
          
          Deployed from commit ${{ github.sha }}
          
          **Author:** ${{ github.actor }}
          **Branch:** ${{ github.ref_name }}
        draft: false
        prerelease: false