name: Development CI Pipeline

on:
  push:
    branches: [ development, 'feature/*', 'hotfix/*' ]
  pull_request:
    branches: [ development ]
  workflow_dispatch:

# Configure permissions for GITHUB_TOKEN
permissions:
  contents: read          # Read repository content
  pull-requests: write   # Comment on PRs

env:
  NODE_VERSION: '18'

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run linting
      run: npm run lint

    - name: Run unit tests
      run: npm run test:unit -- --coverage --watchAll=false

    - name: Run integration tests  
      run: npm run test:integration -- --coverage --watchAll=false

    - name: Run security audit
      run: npm audit --audit-level=critical

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage/lcov.info
        fail_ci_if_error: false

  build-verification:
    runs-on: ubuntu-latest
    needs: test
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Build application
      run: npm run build
      env:
        REACT_APP_ENV: development

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: build-files-dev
        path: build/
        retention-days: 7

  # Comment on PR with status
  pr-feedback:
    runs-on: ubuntu-latest
    needs: [test, build-verification]
    if: github.event_name == 'pull_request'
    
    steps:
    - name: Comment on PR
      uses: actions/github-script@v7
      with:
        script: |
          const comment = `## ✅ Development CI Pipeline Status
          
          **Tests Passed** - All unit and integration tests are passing
          **Linting Passed** - Code style and quality checks passed  
          **Security Check Passed** - No moderate/high vulnerabilities found
          **Build Verification Passed** - Application builds successfully
          
          ### 🚀 Ready for Review
          This PR has passed all automated checks and is ready for code review.
          
          **Next Steps:**
          1. Code Review → Request review from team
          2. Merge to development → Continue integration testing`;
          
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: comment
          });