name: Development CI/CD

on:
  push:
    branches: [ development ]
  pull_request:
    branches: [ development ]

# Configure permissions for GITHUB_TOKEN
permissions:
  contents: read          # Read repository content
  packages: write         # Write to GitHub Container Registry
  pull-requests: write   # Comment on PRs

env:
  NODE_VERSION: '18'

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run unit tests
      run: npm run test:unit -- --coverage --watchAll=false

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage/lcov.info
        fail_ci_if_error: false

  build:
    runs-on: ubuntu-latest
    needs: test
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Build application
      run: npm run build
      env:
        REACT_APP_ENV: development
        # REACT_APP_API_URL: ${{ secrets.DEV_API_URL }}  # Add when you have an API

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: build-files-dev
        path: build/
        retention-days: 7

  # Comment on PR to inform about Docker build that will happen on merge
  pr-info:
    runs-on: ubuntu-latest
    needs: [test, build]
    if: github.event_name == 'pull_request'
    
    steps:
    - name: Comment on PR
      uses: actions/github-script@v7
      with:
        script: |
          const comment = `## 🔄 CI/CD Pipeline Status
          
          ✅ **Unit Tests Passed** - All unit tests are passing
          ✅ **Build Successful** - Application builds without errors
          
          ### 🚀 What happens when this PR is merged:
          - Docker image will be built and published to GitHub Container Registry
          - Image will be tagged as \`ghcr.io/${{ github.repository }}:dev-latest\`
          - Automatic deployment to development environment
          
          **Note:** Integration tests will run on staging and production pipelines for comprehensive validation.
          
          **Ready to merge!** 🎉`;
          
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: comment
          });

  docker-build:
    runs-on: ubuntu-latest
    needs: [test, build]
    # Only run on push to development (merged PRs), not on PR creation
    if: github.event_name == 'push' && github.ref == 'refs/heads/development'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build Docker image (no push)
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile
        push: false
        tags: |
          ghcr.io/${{ github.repository }}:dev-latest
          ghcr.io/${{ github.repository }}:dev-${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        outputs: type=docker,dest=/tmp/image.tar
        labels: |
          org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          org.opencontainers.image.description=MyFinance Client - Development Build
          org.opencontainers.image.licenses=MIT

    - name: Upload Docker image artifact
      uses: actions/upload-artifact@v4
      with:
        name: docker-image-dev
        path: /tmp/image.tar
        retention-days: 7

  docker-publish:
    runs-on: ubuntu-latest
    needs: [docker-build]
    # Only run when docker-build runs (i.e., on merged PRs)
    if: github.event_name == 'push' && github.ref == 'refs/heads/development'
    
    steps:
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Download Docker image artifact
      uses: actions/download-artifact@v4
      with:
        name: docker-image-dev
        path: /tmp

    - name: Load Docker image
      run: |
        docker load --input /tmp/image.tar
        docker image ls -a

    - name: Push Docker image to registry
      run: |
        docker push ghcr.io/${{ github.repository }}:dev-latest
        docker push ghcr.io/${{ github.repository }}:dev-${{ github.sha }}

    - name: Make package public
      run: |
        echo "Attempting to make package public..."
        
        # Wait a moment for package to be fully created
        sleep 10
        
        # Try organization endpoint first, then user endpoint
        if curl -s -X PATCH \
          -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
          -H "Accept: application/vnd.github.v3+json" \
          https://api.github.com/orgs/${{ github.repository_owner }}/packages/container/client \
          -d '{"visibility":"public"}'; then
          echo "✅ Package made public via organization endpoint"
        elif curl -s -X PATCH \
          -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
          -H "Accept: application/vnd.github.v3+json" \
          https://api.github.com/user/packages/container/client \
          -d '{"visibility":"public"}'; then
          echo "✅ Package made public via user endpoint"
        else
          echo "⚠️ Could not set package visibility - this is normal for new packages"
          echo "Package will be public by default or you can set it manually in GitHub"
        fi

    - name: Verify image publication
      run: |
        echo "Verifying image was published successfully..."
        
        # Check if we can pull the image we just pushed
        if docker pull ghcr.io/${{ github.repository }}:dev-latest; then
          echo "✅ Image successfully published and accessible"
          docker image ls ghcr.io/${{ github.repository }}:dev-latest
        else
          echo "❌ Failed to pull published image"
          exit 1
        fi

    - name: Image publication summary
      run: |
        echo "## 🚀 Docker Image Published Successfully" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Registry:** GitHub Container Registry" >> $GITHUB_STEP_SUMMARY
        echo "**Image:** \`ghcr.io/${{ github.repository }}\`" >> $GITHUB_STEP_SUMMARY
        echo "**Tags:**" >> $GITHUB_STEP_SUMMARY
        echo "- \`dev-latest\`" >> $GITHUB_STEP_SUMMARY
        echo "- \`dev-${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Pull Command:**" >> $GITHUB_STEP_SUMMARY
        echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
        echo "docker pull ghcr.io/${{ github.repository }}:dev-latest" >> $GITHUB_STEP_SUMMARY
        echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Package URL:** [View in GitHub](https://github.com/${{ github.repository }}/pkgs/container/client)" >> $GITHUB_STEP_SUMMARY

  deploy-dev:
    runs-on: ubuntu-latest
    needs: [docker-publish]
    environment: development
    # Only run when docker-publish runs (i.e., on merged PRs)
    if: github.event_name == 'push' && github.ref == 'refs/heads/development'
    
    steps:
    - name: Deploy to Development Environment
      run: |
        echo "Deploying to development environment..."
        # Add your deployment commands here
        # For example, deploy to development server or update container