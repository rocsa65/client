name: Development CI Pipeline

on:
  push:
    branches: [ development, 'feature/*', 'hotfix/*' ]
  pull_request:
    branches: [ development ]
  workflow_dispatch:

# Configure permissions for GITHUB_TOKEN
permissions:
  contents: read          # Read repository content
  pull-requests: write   # Comment on PRs

env:
  NODE_VERSION: '18'

jobs:
  # ====================================
  # STAGE 1: Build
  # ====================================
  build:
    name: "Build Application"
    runs-on: ubuntu-latest

    steps:
    # --- Setup Stage ---
    - name: 📥 Checkout code
      uses: actions/checkout@v4

    - name: ⚙️ Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'

    - name: 📦 Install dependencies
      run: npm ci

    # --- Build Stage ---
    - name: 🔨 Build application
      run: npm run build
      env:
        REACT_APP_ENV: development

    # --- Security Stage ---
    - name: 🔒 Run security audit
      run: npm audit --audit-level=critical

  # ====================================
  # STAGE 2: Unit Tests
  # ====================================
  unit-tests:
    name: "Unit Tests"
    runs-on: ubuntu-latest
    needs: build

    steps:
    # --- Setup Stage ---
    - name: 📥 Checkout code
      uses: actions/checkout@v4

    - name: ⚙️ Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'

    - name: 📦 Install dependencies
      run: npm ci

    # --- Test Stage ---
    - name: 🧪 Run unit tests
      run: npm run test:unit -- --coverage --watchAll=false

    # --- Coverage Stage ---
    - name: 📊 Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage/lcov.info
        fail_ci_if_error: false

  # ====================================
  # STAGE 3: Build Verification
  # ====================================
  build-verification:
    name: "Build Verification"
    runs-on: ubuntu-latest
    needs: [build, unit-tests]
    
    steps:
    # --- Setup Stage ---
    - name: 📥 Checkout code
      uses: actions/checkout@v4

    - name: ⚙️ Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'

    - name: 📦 Install dependencies
      run: npm ci

    # --- Build Stage ---
    - name: 🔨 Build application (Release)
      run: npm run build
      env:
        REACT_APP_ENV: development

    # --- Artifact Stage ---
    - name: 📤 Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: build-files-dev
        path: build/
        retention-days: 7

  # ====================================
  # STAGE 4: PR Feedback
  # ====================================
  pr-feedback:
    name: "PR Feedback"
    runs-on: ubuntu-latest
    needs: [build, unit-tests, build-verification]
    if: github.event_name == 'pull_request'
    
    steps:
    - name: 💬 Update PR with status
      uses: actions/github-script@v7
      with:
        script: |
          const commentBody = `## ✅ Development CI Pipeline Status

          **Build Status** - ✅ Passed
          **Unit Tests** - ✅ All tests passing
          **Build Verification** - ✅ Application builds successfully
          **Security Check** - ✅ No critical vulnerabilities found

          ### 🚀 Ready for Review
          This PR has passed all automated checks and is ready for code review.

          **Next Steps:**
          1. Code Review → Request review from team
          2. Merge to development branch

          ---
          *Last updated: ${new Date().toUTCString()}*
          *Commit: ${context.sha.substring(0, 7)}*`;

          // Find existing comment
          const { data: comments } = await github.rest.issues.listComments({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
          });

          const botComment = comments.find(comment =>
            comment.user.type === 'Bot' &&
            comment.body.includes('Development CI Pipeline Status')
          );

          // Update existing comment or create new one
          if (botComment) {
            await github.rest.issues.updateComment({
              comment_id: botComment.id,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: commentBody
            });
          } else {
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: commentBody
            });
          }